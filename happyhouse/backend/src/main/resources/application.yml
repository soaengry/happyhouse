spring:
  profiles:
    include: env, oauth
    active: local

  application:
    name: happyhouse

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/happyhouse_data?&serverTimezone=Asia/Seoul

  jpa:
    generate-ddl: true
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000

  data:
    redis:
      port: 6379
      host: localhost

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  servlet:
    context-path: /api

# MyBatis
mybatis:
  config-location: classpath:/config/mybatis-config.xml

# upload path

app:
  path:
    upload: upload